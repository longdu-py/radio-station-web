<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>私人伤感情感收音机 | 在线电台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="audioCanvas"></canvas>
  <div class="container">
    <header class="header">
      <h1>📻 深夜情感收音机</h1>
      <p>伤感情歌 | 深夜故事 | 怀旧老歌 | 治愈独白</p>
    </header>

    <div class="radio-box">
      <div class="radio-info">
        <h2 id="radioName">未选择电台</h2>
        <p id="radioDesc">请在下方频道列表点击播放</p>
      </div>
      <div class="control-group">
        <button id="prevRadio">上一台</button>
        <button id="playBtn" class="play-main">播放</button>
        <button id="nextRadio">下一台</button>
      </div>
      <div class="tool-row">
        <div class="volume">
          <span>音量</span>
          <input type="range" min="0" max="100" value="75" id="volumeSlider" />
        </div>
        <div class="sleep-box">
          <span>定时关闭：</span>
          <select id="sleepTime">
            <option value="0">关闭定时</option>
            <option value="30">30分钟</option>
            <option value="60">60分钟</option>
            <option value="120">120分钟</option>
          </select>
        </div>
        <button id="collectBtn" class="collect-btn">♥ 收藏电台</button>
      </div>
    </div>

    <div class="add-radio">
      <h3>自定义添加网络电台流(m3u8/mp3)</h3>
      <input type="text" id="radioTitle" placeholder="输入电台名称">
      <input type="text" id="radioUrl" placeholder="粘贴直播源链接">
      <button id="addCustomBtn">添加频道</button>
    </div>

    <div class="tab-wrap">
      <button class="tab active" data-type="all">全部频道</button>
      <button class="tab" data-type="love">我的收藏</button>
    </div>

    <div class="radio-list" id="radioList"></div>
    <audio id="radioAudio" crossorigin="anonymous">
  </div>
  <script src="app.js"></script>
</body>
</html>
